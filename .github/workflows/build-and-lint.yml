name: Build and lint

on:
  - push
  - pull_request

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check format
        run: |
          find . -path '*./build*' -prune -o -type f -name '*.[c|h]' -print | xargs clang-format-18 --style=file --dry-run -Werror
      - name: Configure
        run: |
          PROJECT_DIR=$(find . -name "CMakeLists.txt" -not -path "*/build/*" -printf '%h' -quit)
          echo "Found project in: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          # -DCMAKE_EXPORT_COMPILE_COMMANDS=ON is important for clang-tidy
          cmake . -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Build
        run: |
          cmake --build build
      - name: Lint
        run: |
          cp build/compile_commands.json .
          run-clang-tidy-18 -p build